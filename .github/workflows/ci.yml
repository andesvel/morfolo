name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck, core tests in a real browser, and build.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (web)
        run: pnpm --dir apps/web lint

      - name: Typecheck (core)
        run: pnpm --dir packages/core typecheck

      - name: Install Chromium for the core tests
        run: pnpm --dir packages/core exec playwright install --with-deps chromium-headless-shell

      - name: Test (core, Vitest browser mode)
        run: pnpm --dir packages/core test

      - name: Build (core dist, then web; web build includes tsc -b)
        run: pnpm build

  # Every commit must follow Conventional Commits: the version bot reads them.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
