name: Deploy

on:
  # Production: every push to main (merged release PRs included).
  push:
    branches: [main]
  # Previews: a separate Worker version per PR, never promoted to production.
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    # Secrets are not available to fork PRs; skip their previews.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.url.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (core dist, then web)
        run: pnpm build

      - name: Deploy to production
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        run: pnpm exec wrangler deploy

      # Preview versions can only be uploaded to a Worker that already exists,
      # and it is first created by the production deploy on main. Until then,
      # skip with a warning instead of failing the PR.
      - name: Upload preview version
        id: preview
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        run: |
          set +e
          pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" 2>&1 | tee wrangler.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -q "Worker that does not yet exist" wrangler.log; then
            echo "::warning::No preview yet: the morfolo Worker is created by the first production deploy (merge to main)."
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Resolve URL
        id: url
        if: github.event_name != 'pull_request' || steps.preview.outputs.uploaded == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=https://pr-${{ github.event.pull_request.number }}-morfolo.andesvel.workers.dev" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://morfolo.andesvel.workers.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: steps.url.outputs.url != ''
        run: echo "Deployed to ${{ steps.url.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
