name: Deploy

on:
  # Production: every push to main (merged release PRs included).
  push:
    branches: [main]
  # Previews: a separate Worker version per PR, never promoted to production.
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    # Secrets are not available to fork PRs; skip their previews.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.url.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --dir apps/web build

      - name: Deploy to production
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        run: pnpm exec wrangler deploy

      - name: Upload preview version
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        run: pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}"

      - name: Resolve URL
        id: url
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=https://pr-${{ github.event.pull_request.number }}-morfolo.andesvel.workers.dev" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://morfolo.andesvel.workers.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: echo "Deployed to ${{ steps.url.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
